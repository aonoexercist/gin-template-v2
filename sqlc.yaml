version: "2"
# One shared generated package. Each feature still owns its own query.sql.
# sqlc reads the goose migrations as the schema (the "-- +goose Down" parts are ignored).
overrides:
  go:
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: timestamptz
        go_type: time.Time

sql:
  - name: app
    engine: postgresql
    schema: db/migrations
    queries:
      - internal/features/user/query.sql
      - internal/features/auth/query.sql
      - internal/features/organization/query.sql
    gen:
      go:
        package: dbgen
        out: internal/platform/dbgen
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true