version: "2"
# One entry per feature: each feature owns its queries and its generated package.
# sqlc reads the goose migrations as the schema (the "-- +goose Down" parts are ignored).
overrides:
  go:
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: timestamptz
        go_type: time.Time

sql:
  - name: users
    engine: postgresql
    schema: db/migrations
    queries: internal/features/user/query.sql
    gen:
      go:
        package: userdb
        out: internal/features/user/userdb
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
  - name: auth
    engine: postgresql
    schema: db/migrations
    queries: internal/features/auth/query.sql
    gen:
      go:
        package: authdb
        out: internal/features/auth/authdb
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
