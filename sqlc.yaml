version: "2"
# One entry per feature: each feature owns its queries and its generated package.
# sqlc reads the goose migrations as the schema (the "-- +goose Down" parts are ignored).
sql:
  - name: users
    engine: postgresql
    schema: db/migrations
    queries: internal/features/users/queries.sql
    gen:
      go:
        package: usersdb
        out: internal/features/users/usersdb
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
