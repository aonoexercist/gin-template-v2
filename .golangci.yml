version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - unconvert
  exclusions:
    paths:
      - internal/features/.*/.*db # sqlc generated
    rules:
      - path: '_test\.go'
        linters: [gosec]
      - text: ".*http\\.Cookie missing.*"
        linters: [gosec]
      - text: ".*integer overflow conversion.*"
        linters: [gosec]
